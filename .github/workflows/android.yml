name: DIV EDIT Play Store Release v1.0

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Build web editor
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: Apply DIV EDIT security hardening
        run: bash security/android/harden.sh
      - name: Configure Android SDK 36
        run: |
          sed -i "s/targetSdkVersion = .*/targetSdkVersion = 36/" android/variables.gradle || true
          sed -i "s/compileSdkVersion = .*/compileSdkVersion = 36/" android/variables.gradle || true
          grep -E "targetSdkVersion|compileSdkVersion" android/variables.gradle || true
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Verify security source is present
        run: test -f android/app/src/main/cpp/CMakeLists.txt && test -f android/app/src/main/java/ng/divstudio/divcut/security/SecurityGuard.java && test -f android/app/proguard-rules-security.pro
      - name: Configure release signing
        env:
          DIV_EDIT_KEYSTORE_BASE64: ${{ secrets.DIV_EDIT_KEYSTORE_BASE64 }}
          DIV_EDIT_KEYSTORE_PASSWORD: ${{ secrets.DIV_EDIT_KEYSTORE_PASSWORD }}
          DIV_EDIT_KEY_ALIAS: ${{ secrets.DIV_EDIT_KEY_ALIAS }}
          DIV_EDIT_KEY_PASSWORD: ${{ secrets.DIV_EDIT_KEY_PASSWORD }}
        run: |
          if [ -n "$DIV_EDIT_KEYSTORE_BASE64" ] && [ -n "$DIV_EDIT_KEYSTORE_PASSWORD" ] && [ -n "$DIV_EDIT_KEY_ALIAS" ] && [ -n "$DIV_EDIT_KEY_PASSWORD" ]; then
            echo "Using configured DIV EDIT release signing key."
            echo "$DIV_EDIT_KEYSTORE_BASE64" | base64 --decode > android/div-edit-upload.jks
          else
            echo "::warning::Production signing secrets are not configured; generating an ephemeral release keystore for this APK/AAB build."
            keytool -genkeypair -v               -keystore android/div-edit-upload.jks               -storepass android               -keypass android               -alias divedit-release               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=DIV EDIT AI,O=DivStudio,C=NG"
            DIV_EDIT_KEYSTORE_PASSWORD=android
            DIV_EDIT_KEY_ALIAS=divedit-release
            DIV_EDIT_KEY_PASSWORD=android
          fi
          cat >> android/gradle.properties <<EOF
          DIV_EDIT_KEYSTORE_FILE=../div-edit-upload.jks
          DIV_EDIT_KEYSTORE_PASSWORD=$DIV_EDIT_KEYSTORE_PASSWORD
          DIV_EDIT_KEY_ALIAS=$DIV_EDIT_KEY_ALIAS
          DIV_EDIT_KEY_PASSWORD=$DIV_EDIT_KEY_PASSWORD
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/build.gradle")
          s=p.read_text()
          if "DIV_EDIT_KEYSTORE_FILE" not in s:
              s=s.replace("android {", '''android {
              signingConfigs {
                  release {
                      storeFile file(project.findProperty("DIV_EDIT_KEYSTORE_FILE"))
                      storePassword project.findProperty("DIV_EDIT_KEYSTORE_PASSWORD")
                      keyAlias project.findProperty("DIV_EDIT_KEY_ALIAS")
                      keyPassword project.findProperty("DIV_EDIT_KEY_PASSWORD")
                  }
              }''', 1)
          if "signingConfig signingConfigs.release" not in s:
              s=s.replace("release {\n            minifyEnabled true", "release {\n            signingConfig signingConfigs.release\n            minifyEnabled true", 1)
          p.write_text(s)
          PY
      - name: Build release AAB and APK
        working-directory: android
        run: ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace
      - name: Verify release artifacts
        run: |
          test -s android/app/build/outputs/bundle/release/app-release.aab
          test -s android/app/build/outputs/apk/release/app-release.apk
          unzip -t android/app/build/outputs/apk/release/app-release.apk >/dev/null
      - name: Upload Play Store artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DIV-EDIT-Play-Store-Release-v1.0
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
