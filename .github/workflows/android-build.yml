name: DIV EDIT AI Android Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create CI debug keystore
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore "${GITHUB_WORKSPACE}/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          test -s "${GITHUB_WORKSPACE}/debug.keystore"

      - name: Build debug APK and run unit tests
        shell: bash
        run: |
          gradle --no-daemon --no-build-cache clean test assembleDebug

      - name: Prepare APK for download
        shell: bash
        run: |
          APK_SOURCE=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$APK_SOURCE"
          cp "$APK_SOURCE" DivEditAI.apk
          sha256sum DivEditAI.apk | tee DivEditAI.apk.sha256
          test -s DivEditAI.apk
          test -s DivEditAI.apk.sha256

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: div-edit-ai-debug-apk
          path: |
            DivEditAI.apk
            DivEditAI.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub release with APK and checksum
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.${{ github.run_number }}"
          gh release create "$TAG" \
            DivEditAI.apk \
            DivEditAI.apk.sha256 \
            --title "DIV EDIT AI $TAG" \
            --notes "DIV EDIT AI Android APK. Built and verified automatically from main. SHA-256 checksum is provided for download verification." \
            --latest
