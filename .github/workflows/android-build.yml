name: DIV EDIT AI Android Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create CI signing keystore
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore "${GITHUB_WORKSPACE}/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=DIV EDIT AI,O=DivStudio,C=NG"
          test -s "${GITHUB_WORKSPACE}/debug.keystore"

      - name: Run unit tests and build release APK
        shell: bash
        run: |
          gradle --no-daemon --no-build-cache clean test assembleRelease

      - name: Prepare release APK
        shell: bash
        run: |
          APK_SOURCE=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$APK_SOURCE"
          cp "$APK_SOURCE" DivEditAI-release.apk
          sha256sum DivEditAI-release.apk | tee DivEditAI-release.apk.sha256
          test -s DivEditAI-release.apk
          test -s DivEditAI-release.apk.sha256

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: div-edit-ai-release-apk
          path: |
            DivEditAI-release.apk
            DivEditAI-release.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.${{ github.run_number }}"
          gh release create "$TAG" \
            DivEditAI-release.apk \
            DivEditAI-release.apk.sha256 \
            --title "DIV EDIT AI $TAG" \
            --notes "DIV EDIT AI release APK. Built after unit-test verification. SHA-256 checksum is included." \
            --latest
