name: DIV EDIT AI Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build debug APK and run unit tests
        env:
          DIV_EDIT_FFMPEG_BASE_URL: ''
        run: gradle --no-daemon test assembleDebug

      - name: Prepare APK for download
        run: cp app/build/outputs/apk/debug/*.apk app/build/outputs/apk/debug/DivEditAI.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: div-edit-ai-debug-apk
          path: app/build/outputs/apk/debug/DivEditAI.apk
          if-no-files-found: error

      - name: Publish GitHub release with APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.${{ github.run_number }}"
          gh release create "$TAG" app/build/outputs/apk/debug/DivEditAI.apk \
            --title "DIV EDIT AI $TAG" \
            --notes "DIV EDIT AI Android APK. Built automatically from main." \
            --latest
