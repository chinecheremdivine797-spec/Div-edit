name: DIV EDIT AI Android Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create CI debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Verify BuildConfig source before build
        shell: bash
        run: |
          grep -n 'DIV_EDIT_FFMPEG_BASE_URL' app/build.gradle.kts
          test "$(grep -c 'buildConfigField(\"String\", \"DIV_EDIT_FFMPEG_BASE_URL\", \"\\\"\\\"\")' app/build.gradle.kts)" -eq 1

      - name: Build debug APK and run unit tests
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --no-build-cache clean test assembleDebug

      - name: Verify generated BuildConfig
        shell: bash
        run: |
          BUILD_CONFIG=$(find app/build/generated/source/buildConfig/debug -type f -name BuildConfig.java | head -n 1)
          test -n "$BUILD_CONFIG"
          grep -F 'public static final String DIV_EDIT_FFMPEG_BASE_URL = "";' "$BUILD_CONFIG"

      - name: Prepare APK for download
        shell: bash
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk DivEditAI.apk
          sha256sum DivEditAI.apk | tee DivEditAI.apk.sha256

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: div-edit-ai-debug-apk
          path: |
            DivEditAI.apk
            DivEditAI.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub release with APK and checksum
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: DIV EDIT AI v0.1.${{ github.run_number }}
          body: |
            DIV EDIT AI Android APK — built and verified automatically from main.
          files: |
            DivEditAI.apk
            DivEditAI.apk.sha256
